services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustmap-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Data Source=/app/App_Data/trustmap.db;Foreign Keys=True;
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__Issuer: TrustMap.Api
      Jwt__Audience: TrustMap.iOS
      Jwt__SigningKey: trustmap-local-development-signing-key-change-before-production
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "30"
      AppleAuth__Issuer: https://appleid.apple.com
      AppleAuth__AllowedAudiences__0: com.example.trustmap
      PhotoStorage__Provider: local
      PhotoStorage__RootPath: /app/storage/photos
      PhotoStorage__RequestPath: /uploads
    ports:
      - "8080:8080"
    volumes:
      - trustmap_sqlite_data:/app/App_Data
      - trustmap_photo_data:/app/storage/photos

volumes:
  trustmap_sqlite_data:
  trustmap_photo_data:
